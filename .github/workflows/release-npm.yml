# Release sql-optimizer-cli as npm packages.
#
# Triggered by pushing a tag like v0.1.0 or manually via workflow_dispatch.
# Builds one prebuilt Rust binary per runner (matrix), then a publish job
# reuses scripts/release-npm.sh's assembly by building per-target and
# publishing each platform package, then the wrapper package.
#
# Required secret: NPM_TOKEN (automation-type npm access token).

name: release-npm

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-latest
            suffix: darwin-arm64
          - target: x86_64-apple-darwin
            runner: macos-latest
            suffix: darwin-x64
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            suffix: linux-x64
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-latest
            suffix: linux-arm64
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (Linux musl targets)
        if: contains(matrix.target, 'musl')
        run: cargo install cross --locked

      - name: Build
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          CARGO_VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [[ "$VERSION" != "$CARGO_VERSION" ]]; then
            echo "Release tag $VERSION does not match Cargo.toml version $CARGO_VERSION" >&2
            exit 1
          fi
          rustup target add ${{ matrix.target }}
          if [[ "${{ matrix.target }}" == *musl* ]]; then
            # cross runs the build inside a container with musl-gcc, perl and
            # make — required for the vendored OpenSSL in Cargo.toml.
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: sql-optimizer-cli-${{ matrix.suffix }}
          path: target/${{ matrix.target }}/release/sql-optimizer-cli

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Assemble and publish platform packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${VERSION#v}"
          cd artifacts
          # Each artifact dir IS the platform package dir (named
          # sql-optimizer-cli-<suffix>, containing the binary) — write the
          # package.json in place and publish from there.
          for dir in sql-optimizer-cli-*; do
            suffix="${dir#sql-optimizer-cli-}"
            # Skip versions already on npm so tag re-runs are idempotent
            # (published versions are immutable).
            if npm view "sql-optimizer-cli-${suffix}@${VERSION}" version >/dev/null 2>&1; then
              echo "sql-optimizer-cli-${suffix}@${VERSION} already published — skipping"
              continue
            fi
            chmod +x "$dir/sql-optimizer-cli"
            case "$suffix" in
              darwin-arm64) os=darwin; cpu=arm64 ;;
              darwin-x64)   os=darwin; cpu=x64 ;;
              linux-x64)    os=linux;  cpu=x64 ;;
              linux-arm64)  os=linux;  cpu=arm64 ;;
            esac
            cat > "$dir/package.json" <<EOF
          {
            "name": "sql-optimizer-cli-${suffix}",
            "version": "$VERSION",
            "description": "Prebuilt sql-optimizer-cli binary for ${os}-${cpu}",
            "license": "MIT",
            "repository": {"type": "git", "url": "https://github.com/anthonyy616/sql-optimizer-cli.git"},
            "os": ["$os"],
            "cpu": ["$cpu"],
            "files": ["sql-optimizer-cli"]
          }
          EOF
            (cd "$dir" && npm publish --access public)
          done

      - name: Publish wrapper package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${VERSION#v}"
          CARGO_VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' ../Cargo.toml | head -1)
          if [[ "$VERSION" != "$CARGO_VERSION" ]]; then
            echo "Release tag $VERSION does not match Cargo.toml version $CARGO_VERSION" >&2
            exit 1
          fi
          cd npm
          # npm pkg set (unlike npm version) does not error when the value is
          # unchanged — the wrapper may already carry this version.
          npm pkg set version="$VERSION"
          for suffix in darwin-arm64 darwin-x64 linux-arm64 linux-x64; do
            npm pkg set "optionalDependencies.sql-optimizer-cli-${suffix}=$VERSION"
          done
          if npm view "sql-optimizer-cli@$VERSION" version >/dev/null 2>&1; then
            echo "sql-optimizer-cli@$VERSION already published — skipping"
          else
            npm publish --access public
          fi
