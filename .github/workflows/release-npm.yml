# Release sql-optimizer-cli as npm packages.
#
# Triggered by pushing a tag like v0.1.0 or manually via workflow_dispatch.
# Builds one prebuilt Rust binary per runner (matrix), then a publish job
# reuses scripts/release-npm.sh's assembly by building per-target and
# publishing each platform package, then the wrapper package.
#
# Required secret: NPM_TOKEN (automation-type npm access token).

name: release-npm

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-latest
            suffix: darwin-arm64
          - target: x86_64-apple-darwin
            runner: macos-latest
            suffix: darwin-x64
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            suffix: linux-x64
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-latest
            suffix: linux-arm64
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (Linux musl targets)
        if: contains(matrix.target, 'musl')
        run: cargo install cross --locked

      - name: Build
        run: |
          rustup target add ${{ matrix.target }}
          if [[ "${{ matrix.target }}" == *musl* ]]; then
            # cross runs the build inside a container with musl-gcc, perl and
            # make — required for the vendored OpenSSL in Cargo.toml.
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: sql-optimizer-cli-${{ matrix.suffix }}
          path: target/${{ matrix.target }}/release/sql-optimizer-cli

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Assemble and publish platform packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${VERSION#v}"
          cd artifacts
          for dir in sql-optimizer-cli-*; do
            suffix="${dir#sql-optimizer-cli-}"
            pkg_name="sql-optimizer-cli-${suffix}"
            mkdir -p "$pkg_name"
            cp "$dir/sql-optimizer-cli" "$pkg_name/sql-optimizer-cli"
            chmod +x "$pkg_name/sql-optimizer-cli"
            case "$suffix" in
              darwin-arm64) os=darwin; cpu=arm64 ;;
              darwin-x64)   os=darwin; cpu=x64 ;;
              linux-x64)    os=linux;  cpu=x64 ;;
              linux-arm64)  os=linux;  cpu=arm64 ;;
            esac
            cat > "$pkg_name/package.json" <<EOF
          {
            "name": "$pkg_name",
            "version": "$VERSION",
            "description": "Prebuilt sql-optimizer-cli binary for ${os}-${cpu}",
            "license": "MIT",
            "repository": {"type": "git", "url": "https://github.com/anthonyy616/sql-optimizer-cli.git"},
            "os": ["$os"],
            "cpu": ["$cpu"],
            "files": ["sql-optimizer-cli"]
          }
          EOF
            (cd "$pkg_name" && npm publish --access public)
          done

      - name: Publish wrapper package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${VERSION#v}"
          cd npm
          npm version "$VERSION" --no-git-tag-version
          npm publish --access public
